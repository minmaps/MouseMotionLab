[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mousemotionlab"
version = "0.1.0"
description = "Personal mouse-motion capture preprocessing, modelling, and sandbox replay tools."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy>=2.2",
    "torch>=2.7",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "matplotlib>=3.10",
    "safetensors>=0.5",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
mousemotion = "mousemotion.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

